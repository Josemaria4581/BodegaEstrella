<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virgen de la Estrella - App Móvil</title>
    <!-- Configuración para modo App en móviles -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .fill-level { transition: height 1.5s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .stainless-steel { background: linear-gradient(to right, #b0b5b9 0%, #eef2f3 25%, #d4d7d9 50%, #eef2f3 75%, #a0a5a9 100%); }
        .liquid-shadow { box-shadow: inset 10px 0 20px rgba(0,0,0,0.3), inset -10px 0 20px rgba(0,0,0,0.1); }
        .glass-panel { background: rgba(28, 25, 23, 0.85); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-stone-100 min-h-screen font-sans text-stone-800 pb-10">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-stone-900 z-50 flex flex-col justify-center items-center p-4">
        <div class="bg-stone-50 p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-stone-200">
            <div class="text-center mb-8">
                <svg class="w-16 h-16 text-rose-800 mx-auto mb-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c0 0-7.5 9-7.5 14.5A7.5 7.5 0 0 0 12 24a7.5 7.5 0 0 0 7.5-7.5C19.5 11 12 2 12 2z"/></svg>
                <h1 class="text-2xl font-black text-stone-800 uppercase tracking-tighter">Virgen de la Estrella</h1>
                <p class="text-xs text-stone-500 font-bold mt-1 uppercase tracking-widest">Control de Bodega</p>
            </div>
            
            <div class="mb-5">
                <label class="block text-xs font-black text-stone-500 uppercase mb-2">Usuario Operario</label>
                <input type="text" id="login-user" class="w-full border-2 border-stone-300 p-3 rounded-xl focus:border-rose-800 outline-none bg-white font-bold" placeholder="ej: jlgarcia">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-black text-stone-500 uppercase mb-2">Contraseña</label>
                <input type="password" id="login-pass" class="w-full border-2 border-stone-300 p-3 rounded-xl focus:border-rose-800 outline-none bg-white font-bold" placeholder="••••••••">
            </div>
            
            <p id="login-error" class="text-red-600 text-xs font-bold mb-4 hidden text-center italic">Acceso denegado: credenciales incorrectas</p>
            
            <button onclick="login()" class="w-full bg-rose-800 hover:bg-rose-900 text-white font-black text-lg py-4 rounded-xl shadow-lg transition-all active:scale-95 uppercase">
                Entrar al Sistema
            </button>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="main-app" class="hidden">
        <header class="bg-stone-900 text-stone-100 p-4 shadow-xl sticky top-0 z-30 border-b-4 border-rose-800">
            <div class="container mx-auto flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-lg font-black flex items-center gap-2 uppercase">
                        <svg class="w-5 h-5 text-rose-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c0 0-7.5 9-7.5 14.5A7.5 7.5 0 0 0 12 24a7.5 7.5 0 0 0 7.5-7.5C19.5 11 12 2 12 2z"/></svg>
                        Virgen de la Estrella
                    </h1>
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-bold text-stone-400 bg-stone-800 px-2 py-1 rounded border border-stone-700 flex items-center gap-1">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                            <span id="display-user">Usuario</span>
                        </span>
                        <button onclick="logout()" class="text-rose-400 hover:text-white transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        </button>
                    </div>
                </div>
                
                <!-- Navegación -->
                <div class="flex bg-stone-800 rounded-xl p-1 w-full self-center border border-stone-700 shadow-inner">
                    <button id="btn-grid" onclick="setView('grid')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-stone-600 text-white shadow transition-all flex justify-center items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                        3D
                    </button>
                    <button id="btn-list" onclick="setView('list')" class="flex-1 py-2 text-xs font-bold rounded-lg text-stone-400 hover:text-white transition-all flex justify-center items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        LISTA
                    </button>
                    <button id="btn-history" onclick="setView('history')" class="flex-1 py-2 text-xs font-bold rounded-lg text-stone-400 hover:text-white transition-all flex justify-center items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        LOG
                    </button>
                </div>
            </div>
        </header>

        <main class="container mx-auto p-4 max-w-5xl">
            
            <!-- BUSCADOR -->
            <div id="search-container" class="bg-white p-3 rounded-2xl shadow-sm border border-stone-200 mb-6 flex flex-col md:flex-row gap-3">
                <div class="relative flex-grow">
                    <input type="text" id="search-input" onkeyup="applyFilters()" placeholder="Buscar depósito..." class="w-full pl-10 pr-3 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-rose-800 outline-none bg-stone-50 font-bold text-sm">
                    <svg class="w-5 h-5 text-stone-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <div class="flex gap-2">
                    <select id="filter-select" onchange="applyFilters()" class="flex-1 px-3 py-3 border border-stone-300 rounded-xl bg-stone-50 font-bold text-xs uppercase">
                        <option value="all">Todos</option>
                        <option value="vino_tinto">🍷 Tinto</option>
                        <option value="vino_blanco">🥂 Blanco</option>
                    </select>
                    <div class="flex items-center gap-2 px-3 border border-stone-300 rounded-xl bg-stone-50">
                        <input type="checkbox" id="filter-empty" onchange="applyFilters()" class="w-4 h-4 accent-rose-800">
                        <label for="filter-empty" class="text-[10px] font-black uppercase text-stone-600">Vacíos</label>
                    </div>
                </div>
            </div>

            <!-- VISTAS -->
            <div id="view-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            <div id="view-list" class="hidden flex flex-col gap-2"></div>
            <div id="view-history" class="hidden flex flex-col gap-3">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-black uppercase text-stone-500 tracking-widest font-bold">Historial de Bodega</h2>
                    <button id="btn-clear-history" onclick="clearHistory()" class="hidden text-[10px] font-black text-red-600 border border-red-200 bg-red-50 px-3 py-1 rounded-lg uppercase">Reset Log</button>
                </div>
                <div id="history-list" class="space-y-3"></div>
            </div>

            <div id="no-results" class="hidden text-center py-20">
                <p class="text-stone-400 font-bold italic uppercase text-xs">Sin depósitos con este filtro</p>
            </div>
        </main>

        <!-- MODAL -->
        <div id="edit-modal" class="fixed inset-0 bg-stone-900/80 hidden z-50 transition-all backdrop-blur-sm flex items-end md:items-center justify-center">
            <div class="absolute inset-0" onclick="closeModal()"></div>
            <div class="bg-stone-50 w-full max-w-lg rounded-t-3xl md:rounded-3xl shadow-2xl overflow-hidden slide-up z-10 border border-stone-200">
                <div class="bg-stone-800 text-white p-5 flex justify-between items-center border-b-4 border-rose-800">
                    <div>
                        <h3 id="modal-title" class="font-black text-2xl text-rose-400 uppercase tracking-tighter">DEP</h3>
                        <p id="modal-subtitle" class="text-[10px] font-bold text-stone-400 uppercase tracking-widest mt-1">Vino</p>
                    </div>
                    <button onclick="closeModal()" class="bg-stone-700 p-2 rounded-full text-stone-300 hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="p-6">
                    <div class="bg-white p-4 rounded-2xl border border-stone-200 mb-6 flex justify-between items-center shadow-inner">
                        <div>
                            <p class="text-[9px] font-black text-stone-400 uppercase mb-1">Estado Actual</p>
                            <div class="flex items-baseline gap-2">
                                <span id="modal-current-level" class="text-2xl font-black text-stone-800">0 L</span>
                                <span id="modal-current-grado" class="text-xs font-bold text-rose-800 tracking-widest">0% VOL</span>
                            </div>
                        </div>
                        <div id="modal-color-indicator" class="w-10 h-10 rounded-xl border-2 border-stone-100 shadow-sm"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-[10px] font-black text-stone-500 uppercase mb-2">Nuevo Nivel (Litros)</label>
                            <input type="number" id="input-level" class="w-full border-2 border-stone-200 p-4 rounded-2xl focus:border-rose-800 outline-none text-xl font-black text-center bg-white shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-stone-500 uppercase mb-2">Nuevo Grado (%)</label>
                            <input type="number" step="0.01" id="input-grado" class="w-full border-2 border-stone-200 p-4 rounded-2xl focus:border-rose-800 outline-none text-xl font-black text-center bg-white shadow-sm">
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-[10px] font-black text-stone-500 uppercase mb-2 tracking-widest">Acción / Movimiento</label>
                        <select id="input-action" class="w-full border-2 border-stone-200 p-4 rounded-2xl font-bold bg-white outline-none focus:border-rose-800">
                            <option value="Inventario">Actualización Inventario</option>
                            <option value="Entrada">Entrada de Vino</option>
                            <option value="Trasiego">Salida / Trasiego</option>
                            <option value="Envasado">Envasado</option>
                            <option value="Limpieza">Vaciado y Limpieza</option>
                        </select>
                    </div>

                    <div class="mb-6">
                        <label class="block text-[10px] font-black text-stone-500 uppercase mb-2">Observaciones</label>
                        <textarea id="input-notes" class="w-full border-2 border-stone-200 p-4 rounded-2xl font-bold h-20 text-sm outline-none focus:border-rose-800 bg-white" placeholder="Escribe notas aquí..."></textarea>
                    </div>

                    <button onclick="saveMovement()" id="btn-save" class="w-full bg-stone-900 text-rose-500 font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all flex justify-center items-center gap-3 uppercase tracking-widest border border-stone-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Guardar Cambios
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN SUPABASE (VIRGEN DE LA ESTRELLA)
        // ==========================================
        const { createClient } = supabase;
        const supabaseUrl = 'https://txkqgakiqwpsxvvfhko.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4a3FnYWtpcXdwbXN4dnZmaGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NDMxMjAsImV4cCI6MjA5MzUxOTEyMH0.dwCLSUoM7R3zWNzOYMrmuzxmamCMc3XJq2sHMsFsf0A';
        const db = createClient(supabaseUrl, supabaseKey);

        const usersDB = {
            'jlgarcia': 'Lenovo291580', 'nponce': 'Lenovo801235', 'acortijo': 'Lenovo801231',
            'cgordillo': 'Lenovo801245', 'jvergara': 'Lenovo801223', 'alavado': 'Lenovo801228',
            'jmartin': 'Lenovo801224', 'jmvera': 'Lenovo801277'
        };

        let currentUser = localStorage.getItem('bodega_user') || null;
        let depositsData = [];
        let filteredData = [];
        let currentView = 'grid';

        const productTypes = {
            'vino_tinto': { display: 'Tinto', colorCode: 'bg-rose-900', textColor: 'text-rose-900' },
            'vino_blanco': { display: 'Blanco', colorCode: 'bg-amber-100', textColor: 'text-amber-700' }
        };

        // LOGIN
        const checkLoginState = () => {
            if (currentUser) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('display-user').innerText = currentUser.toUpperCase();
                const btnClear = document.getElementById('btn-clear-history');
                if (['jlgarcia', 'jmvera'].includes(currentUser)) btnClear.classList.remove('hidden');
                initApp(); 
            }
        };

        const login = () => {
            const user = document.getElementById('login-user').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value.trim();
            if (usersDB[user] === pass) {
                currentUser = user;
                localStorage.setItem('bodega_user', user);
                checkLoginState();
            } else {
                const err = document.getElementById('login-error');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 3000);
            }
        };

        const logout = () => {
            localStorage.removeItem('bodega_user');
            location.reload();
        };

        // DATA
        const initApp = async () => {
            const { data, error } = await db.from('depositos').select('*').order('name', { ascending: true });
            if (error) { console.error(error); return; }
            depositsData = data.map(t => ({
                id: t.id, name: t.name, producto: t.producto,
                cantidadActual: t.cantidad_actual, capacidadTotal: t.capacidad_total, grado: t.grado,
                level: Math.min(100, Math.round((t.cantidad_actual / t.capacidad_total) * 100))
            }));
            applyFilters();
            renderHistory();
        };

        const applyFilters = () => {
            const search = document.getElementById('search-input').value.toLowerCase();
            const type = document.getElementById('filter-select').value;
            const empty = document.getElementById('filter-empty').checked;
            filteredData = depositsData.filter(d => 
                d.name.toLowerCase().includes(search) &&
                (type === 'all' || d.producto === type) &&
                (empty || d.cantidadActual > 0)
            );
            document.getElementById('no-results').classList.toggle('hidden', filteredData.length > 0);
            currentView === 'grid' ? renderGrid() : renderList();
        };

        const renderGrid = () => {
            const grid = document.getElementById('view-grid');
            grid.innerHTML = '';
            filteredData.forEach(dep => {
                const type = productTypes[dep.producto];
                const opacity = dep.cantidadActual === 0 ? 'opacity-20' : 'opacity-90';
                const card = document.createElement('div');
                card.className = "cursor-pointer active:scale-95 transition-all";
                card.onclick = () => openModal(dep.id);
                card.innerHTML = `
                    <div class="relative w-full h-48 flex flex-col items-center">
                        <div class="w-11/12 h-3 stainless-steel rounded-t-lg border border-stone-400 z-10 shadow-sm"></div>
                        <div class="w-full h-full relative border-x border-stone-300 overflow-hidden bg-white/50 backdrop-blur z-20">
                            <div class="absolute bottom-0 left-0 w-full ${type.colorCode} ${opacity} liquid-shadow fill-level" style="height: ${dep.level}%"></div>
                            <div class="absolute inset-0 flex flex-col items-center justify-center p-2 z-30">
                                <span class="text-[10px] font-black text-stone-800 bg-white/80 px-2 py-0.5 rounded shadow-sm border border-stone-200 mb-2">${dep.name}</span>
                                <span class="text-sm font-black text-stone-900">${dep.cantidadActual.toLocaleString()} L</span>
                                <span class="text-[8px] font-bold text-rose-800 bg-rose-50 px-1 rounded border border-rose-200 mt-1">${dep.grado}%</span>
                            </div>
                        </div>
                        <div class="w-full h-2 stainless-steel border-x border-b border-stone-400 rounded-b shadow-md z-10"></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        const renderList = () => {
            const list = document.getElementById('view-list');
            list.innerHTML = '';
            filteredData.forEach(dep => {
                const type = productTypes[dep.producto];
                const row = document.createElement('div');
                row.className = "bg-white p-3 rounded-xl border border-stone-200 flex items-center justify-between shadow-sm active:bg-stone-50";
                row.onclick = () => openModal(dep.id);
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-10 rounded-full ${dep.cantidadActual === 0 ? 'bg-stone-200' : type.colorCode}"></div>
                        <div>
                            <p class="text-xs font-black text-stone-800">${dep.name}</p>
                            <p class="text-[10px] font-bold text-stone-400 uppercase tracking-widest">${dep.cantidadActual === 0 ? 'Vacío' : type.display}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-black text-stone-800">${dep.cantidadActual.toLocaleString()} L</p>
                        <p class="text-[9px] font-bold text-rose-800">${dep.grado}% VOL</p>
                    </div>
                `;
                list.appendChild(row);
            });
        };

        const renderHistory = async () => {
            const container = document.getElementById('history-list');
            const { data, error } = await db.from('historial').select('*').order('id', { ascending: false }).limit(30);
            if (error) return;
            container.innerHTML = '';
            data.forEach(h => {
                const item = document.createElement('div');
                item.className = "bg-white p-3 rounded-xl border-l-4 border-rose-800 shadow-sm text-[11px]";
                item.innerHTML = `
                    <div class="flex justify-between font-black text-stone-400 uppercase text-[9px] mb-2">
                        <span>${h.fecha}</span>
                        <span class="bg-stone-100 px-2 rounded tracking-widest">👤 ${h.usuario}</span>
                    </div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-black text-stone-900">${h.deposito}</span>
                        <span class="bg-stone-800 text-white px-1.5 rounded-md text-[9px]">${h.accion}</span>
                    </div>
                    <p class="font-bold text-stone-600">${h.nivel_anterior.toLocaleString()}L ➔ <span class="text-rose-800">${h.nuevo_nivel.toLocaleString()}L</span> | ${h.grado_anterior}% ➔ <span class="text-rose-800">${h.nuevo_grado}%</span></p>
                    ${h.notas ? `<p class="italic text-stone-400 mt-1 border-t border-stone-50 pt-1">"${h.notas}"</p>` : ''}
                `;
                container.appendChild(item);
            });
        };

        const openModal = (id) => {
            currentDepositId = id;
            const dep = depositsData.find(d => d.id === id);
            const type = productTypes[dep.producto];
            document.getElementById('modal-title').innerText = dep.name;
            document.getElementById('modal-subtitle').innerText = dep.cantidadActual === 0 ? 'Vaciado' : type.display;
            document.getElementById('modal-current-level').innerText = dep.cantidadActual.toLocaleString() + ' L';
            document.getElementById('modal-current-grado').innerText = dep.grado + '% VOL';
            document.getElementById('modal-color-indicator').className = `w-10 h-10 rounded-xl shadow-inner border-2 border-stone-200 ${dep.cantidadActual === 0 ? 'bg-stone-200' : type.colorCode}`;
            document.getElementById('input-level').value = dep.cantidadActual;
            document.getElementById('input-grado').value = dep.grado;
            document.getElementById('modal-capacity-info').innerText = `Capacidad: ${dep.capacidadTotal.toLocaleString()} L`;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        const closeModal = () => document.getElementById('edit-modal').classList.add('hidden');

        const setView = (v) => {
            currentView = v;
            ['grid', 'list', 'history'].forEach(x => {
                document.getElementById('view-'+x).classList.toggle('hidden', x !== v);
                document.getElementById('btn-'+x).classList.toggle('bg-stone-600', x === v);
                document.getElementById('btn-'+x).classList.toggle('text-white', x === v);
            });
            document.getElementById('search-container').classList.toggle('hidden', v === 'history');
        };

        const saveMovement = async () => {
            const btn = document.getElementById('btn-save');
            const dep = depositsData.find(d => d.id === currentDepositId);
            const newL = parseInt(document.getElementById('input-level').value) || 0;
            const newG = parseFloat(document.getElementById('input-grado').value) || 0;
            const act = document.getElementById('input-action').value;
            const nts = document.getElementById('input-notes').value;

            if (newL > dep.capacidadTotal) { alert("¡Exceso de capacidad!"); return; }
            btn.disabled = true;
            btn.innerHTML = "Guardando...";

            try {
                await db.from('depositos').update({ cantidad_actual: newL, grado: newG }).eq('id', dep.id);
                await db.from('historial').insert([{
                    fecha: new Date().toLocaleString('es-ES'), usuario: currentUser,
                    deposito: dep.name, producto: productTypes[dep.producto].display,
                    nivel_anterior: dep.cantidadActual, nuevo_nivel: newL,
                    grado_anterior: dep.grado, nuevo_grado: newG, accion: act, notas: nts
                }]);
                location.reload();
            } catch (e) {
                alert("Error al guardar");
                btn.disabled = false;
            }
        };

        const clearHistory = async () => {
            if (confirm("¿Borrar historial?")) {
                await db.from('historial').delete().neq('id', 0);
                location.reload();
            }
        };

        checkLoginState();
    </script>
</body>
</html>
